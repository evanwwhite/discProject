<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disc Golf Website - Home</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <header>
        <div class="header-title">
            <img src="../data/discGolfBasket.svg" alt="Disc Golf Basket" class="basket-icon">
            <h1>BIRDIE FINDER</h1>
        </div>
        
        <div class="header-buttons">
            <button id="nav-home-btn">Home</button>
            <button id="nav-map-btn">Disc Map</button>
            <button id="nav-shop-btn">Shop</button> 
        </div>
    </header>

    <div class="container">
        <div class="home-content">
            <h2>Welcome to Birdie Finder</h2>
            <p>Your ultimate disc golf companion! Find courses, track your game, and discover new discs.</p>
            
            <div class="action-menu">
                <button id="hero-map-btn" class="menu-btn">
                    <span>📍</span> Disc Map
                </button>
                <button id="hero-shop-btn" class="menu-btn">
                    <span>🛒</span> Disc Golf Shop
                </button>
                <button id="hero-compare-btn" class="menu-btn secondary">
                    <span>⚖️</span> Compare Discs (Coming Soon)
                </button>
                <button id="hero-guide-btn" class="menu-btn secondary">
                    <span>📖</span> Flight Guide (Coming Soon)
                </button>
            </div>
        </div>
    </div> 
    <script src="home.js"></script>
</body>
</html>
